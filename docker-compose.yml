services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: we_are_friends
      POSTGRES_USER: we_are_friends
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-we_are_friends}
    # Bind mounts make the durable data visible on the host, independent of
    # container lifetime and Docker volume pruning.
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U we_are_friends -d we_are_friends"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ${DATA_DIR:-./data}/minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done &&
      mc mb --ignore-existing local/media && mc anonymous set download local/media"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  api:
    build: ./backend-go
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      # The host Nginx proxy is the public entry point; the container itself
      # stays reachable only from this machine.
      - "127.0.0.1:${WEB_PORT:-8088}:80"
